name: ci

# Runs on every pull request and push to main; the `ci` gate job is the required status check.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --group dev --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .

  test:
    name: unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6 # PySpark needs a JVM
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --group dev --locked
      - run: uv run pytest --junitxml=pytest-report.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pytest-report
          path: pytest-report.xml

  fabric-items:
    name: validate Fabric items
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python tools/validate_fabric_items.py fabric

  ci:
    name: ci
    if: always()
    needs: [lint, test, fabric-items]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'all(.[]; .result == "success")'
