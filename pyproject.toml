[project]
name = "divvy-medallion"
version = "0.1.0"
description = "PySpark transformations and data-quality rules for the Divvy medallion lakehouse on Microsoft Fabric"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.12"  # matches Fabric Runtime 1.3 (Spark 3.5, Python 3.11)
dependencies = []                  # pyspark is provided by the Fabric runtime

[dependency-groups]
dev = [
    "pyspark==3.5.5",
    "delta-spark==3.2.1",
    "pytest>=8",
    "chispa>=0.10",
    "pyyaml>=6",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling==1.32.4"]  # pinned: wheel bytes must be reproducible (see tools/sync_environment_wheel.py)
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/divvy_medallion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tools"]
addopts = "-ra"

[tool.ruff]
line-length = 120
extend-exclude = ["fabric"]  # Fabric notebook sources (cell markers, injected `spark` global)
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
